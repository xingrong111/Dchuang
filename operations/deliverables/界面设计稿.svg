<text x="70" y="409" class="title">核心功能</text><g fill="white" stroke="#e2e6e2"><rect x="70" y="440" width="180" height="150" rx="16"/><rect x="275" y="440" width="180" height="150" rx="16"/><rect x="480" y="440" width="180" height="150" rx="16"/><rect x="685" y="440" width="180" height="150" rx="16"/></g><text x="99" y="498" class="label">数字博物馆</text><text x="307" y="498" class="label">创作工坊</text><text x="515" y="498" class="label">作品社区</text><text x="719" y="498" class="label">文创订单</text><text x="95" y="544" class="small">文化与馆藏故事</text><text x="299" y="544" class="small">多模态与3D组装</text><text x="507" y="544" class="small">点赞收藏与讨论</text><text x="712" y="544" class="small">商家确认与发货</text>
<text x="70" y="655" class="title">内容与信息状态</text><text x="70" y="705" class="label">统计来自数据库；空数据提供创作入口；失败支持重试。</text><text x="70" y="751" class="label">演示AI与真实服务明确区分；订单不假称已支付。</text><text x="70" y="808" class="small">1440桌面框架参考 · 图形、文本和层级均可编辑</text></g>
