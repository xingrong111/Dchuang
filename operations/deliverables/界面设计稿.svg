<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
<style>text{font-family:'Microsoft YaHei',sans-serif;fill:#2c3e50}.title{font-size:32px;font-weight:700}.label{font-size:18px}.small{font-size:14px}.white{fill:white}</style>
<rect width="1440" height="1000" fill="#dedcd5"/><text x="50" y="45" class="title">智绘锡承 · 桌面与移动端设计源稿</text>
<g transform="translate(40 80)"><rect width="930" height="860" rx="16" fill="#f8f6f0"/>
<rect x="20" y="20" width="890" height="65" rx="8" fill="white"/><rect x="40" y="33" width="40" height="40" rx="10" fill="#4a90a4"/><text x="52" y="61" class="white label">锡</text><text x="100" y="59" class="label">智绘锡承</text><text x="310" y="59" class="small">首页　数字博物馆　共创工坊　社区　商城</text><text x="810" y="59" class="small">登录 / 注册</text>
<text x="70" y="190" class="title">惠山泥人的数字创作体验</text><text x="70" y="234" class="label">文化浏览 · AI辅助 · 部件组装 · 作品分享</text><rect x="70" y="268" width="170" height="46" rx="23" fill="#2d6172"/><text x="107" y="299" class="white label">开始创作</text><rect x="260" y="268" width="170" height="46" rx="23" fill="none" stroke="#4a90a4"/><text x="287" y="299" class="label">探索博物馆</text>
